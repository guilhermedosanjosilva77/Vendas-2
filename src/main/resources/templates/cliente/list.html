<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('clientes')}"></nav>
<main class="container py-4">
    <div class="page-head">
        <div>
            <h1 class="page-title h3 mb-0">Clientes</h1>
            <p class="page-sub" th:text="${#lists.size(clientes) == 1 ? '1 cliente cadastrado' : #lists.size(clientes) + ' clientes cadastrados'}"></p>
        </div>
        <a class="btn btn-primary" th:href="@{/clientes/novo}">+ Novo cliente</a>
    </div>

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <!-- Estado vazio -->
    <div class="card" th:if="${#lists.isEmpty(clientes)}">
        <div class="empty-state">
            <div class="empty-icon">
                <svg class="ico ico-lg" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.5c2 .6 3.5 2.4 3.5 5.5"/></svg>
            </div>
            <h2 class="h5 fw-bold mb-1">Nenhum cliente cadastrado</h2>
            <p class="text-secondary mb-3">Cadastre o primeiro cliente para começar a registrar pedidos.</p>
            <a class="btn btn-primary" th:href="@{/clientes/novo}">Cadastrar cliente</a>
        </div>
    </div>

    <!-- Lista -->
    <th:block th:unless="${#lists.isEmpty(clientes)}">
        <div class="toolbar">
            <div class="search">
                <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input type="search" id="filtro" class="form-control" placeholder="Buscar por nome, e-mail ou CPF" aria-label="Buscar clientes">
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                <tr><th>Cliente</th><th>CPF</th><th>Telefone</th><th>Endereço</th><th class="text-end">Ações</th></tr>
                </thead>
                <tbody>
                <tr class="linha-cliente" th:each="cliente : ${clientes}">
                    <td>
                        <div class="person">
                            <div class="avatar" th:text="${#strings.isEmpty(cliente.nome) ? '?' : #strings.toUpperCase(#strings.substring(cliente.nome, 0, 1))}"></div>
                            <div>
                                <div class="person-name" th:text="${cliente.nome}"></div>
                                <div class="person-sub" th:text="${cliente.email}"></div>
                            </div>
                        </div>
                    </td>
                    <td class="mono text-nowrap" th:text="${cliente.cpf}"></td>
                    <td class="text-nowrap" th:text="${cliente.telefone}"></td>
                    <td>
                        <div th:text="${cliente.logradouro + ', ' + cliente.numero}"></div>
                        <div class="person-sub" th:text="${cliente.bairro + ' - ' + cliente.cidade + '/' + cliente.uf}"></div>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/clientes/edit/{id}(id=${cliente.id})}">Editar</a>
                        <a class="btn btn-sm btn-outline-danger" th:href="@{/clientes/delete/{id}(id=${cliente.id})}">Excluir</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </th:block>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    // Filtro simples na própria página (não consulta o servidor)
    var filtro = document.getElementById('filtro');
    if (filtro) {
        filtro.addEventListener('input', function (e) {
            var termo = e.target.value.trim().toLowerCase();
            document.querySelectorAll('tr.linha-cliente').forEach(function (linha) {
                linha.hidden = termo !== '' && linha.textContent.toLowerCase().indexOf(termo) === -1;
            });
        });
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Excluir cliente')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('clientes')}"></nav>
<main class="container py-4" style="max-width:640px">
    <a class="back-link" th:href="@{/clientes}">&larr; Voltar para clientes</a>

    <div class="card danger-card">
        <div class="card-body">
            <div class="danger-head">
                <div class="danger-icon">
                    <svg class="ico ico-lg" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/><path d="M10 11v5M14 11v5"/></svg>
                </div>
                <div>
                    <h1 class="page-title h4 mb-1">Excluir cliente?</h1>
                    <p class="text-secondary mb-0">Você vai excluir <strong th:text="${cliente.nome}"></strong>. Essa ação não pode ser desfeita.</p>
                </div>
            </div>

            <div class="person my-4">
                <div class="avatar avatar-lg" th:text="${#strings.isEmpty(cliente.nome) ? '?' : #strings.toUpperCase(#strings.substring(cliente.nome, 0, 1))}"></div>
                <div>
                    <div class="person-name fs-5" th:text="${cliente.nome}"></div>
                    <div class="person-sub" th:text="${cliente.email}"></div>
                </div>
            </div>

            <dl class="detail-list">
                <dt>CPF</dt><dd th:text="${cliente.cpf}"></dd>
                <dt>Telefone</dt><dd th:text="${cliente.telefone}"></dd>
                <dt>Endereço</dt>
                <dd th:text="${cliente.logradouro + ', ' + cliente.numero + ' ' + (cliente.complemento ?: '') + ' - ' + cliente.bairro + ', ' + cliente.cidade + '/' + cliente.uf + ' - CEP ' + cliente.cep}"></dd>
            </dl>

            <form class="form-actions mt-4" th:action="@{/clientes/delete/{id}(id=${cliente.id})}" method="post">
                <a th:href="@{/clientes}" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-danger">Excluir cliente</button>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
